<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131d" />
    <title>Orbit Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="browser-shell">
      <header class="toolbar">
        <a class="brand" href="./" aria-label="Orbit Browser home"><span>O</span> Orbit</a>
        <nav class="controls" aria-label="Browser controls">
          <button id="back" title="Preview back (Alt + Left)" aria-label="Go back">&larr;</button>
          <button id="forward" title="Preview forward (Alt + Right)" aria-label="Go forward">&rarr;</button>
          <button id="reload" title="Reload preview" aria-label="Reload page">&#8635;</button>
        </nav>
        <form id="address-form" class="address-form">
          <span class="lock" aria-hidden="true">&#9675;</span>
          <input id="address" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or enter a web address" aria-label="Web address" />
          <button type="submit">Go</button>
        </form>
        <button id="preview" class="preview" title="Show this site inside Orbit when allowed" aria-label="Preview current address">Preview</button>
        <button id="open-external" class="external" title="Open preview in a new tab" aria-label="Open current page in new tab">&#8599;</button>
      </header>

      <section id="viewer" class="viewer">
        <div id="load-status" class="load-status" role="status">Loading...</div>
        <div id="new-tab" class="new-tab"><span>O</span><p>New tab</p><small>Enter an address above. Go opens every site directly; Preview is for embed-friendly sites.</small></div>
        <iframe id="page" title="Web page viewer" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
